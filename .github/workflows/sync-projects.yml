name: Synchroniser les projets GitHub

on:
  schedule:
    - cron: '17 5 * * *'   # tous les jours vers 5h17 (heure d'Abidjan = UTC)
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [master]
    paths:
      - data/featured.json
      - scripts/sync-projects.mjs
      - .github/workflows/sync-projects.yml

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer data/projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-projects.mjs

      - name: Commiter si la liste a changé
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "Rien à commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "Mise à jour automatique des projets"
          git push
